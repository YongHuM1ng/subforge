# SubForge 默认配置
#
# 默认：小米 MiMo 识别 + DeepSeek 官方翻译。
# 在包内 .env 填写：
#   ASR_API_KEY=...          # 当前识别服务的 Key（默认小米 MiMo）
#   LLM_API_KEY=...          # DeepSeek 的 Key
#
# 这里只列常用项；没写的参数使用默认值。
# 完整参数见 config.full.toml（复制覆盖本文件后行为不变）。

[api]
# 翻译服务：DeepSeek 官方 OpenAI-compatible Chat Completions
endpoint = "https://api.deepseek.com/chat/completions"
model = "deepseek-flash"
# 思考等级：none / low / medium / high / max
# low 更快更省；需要更高翻译质量时改成 medium 或 high
reasoning_effort = "low"

[asr]
# 默认：小米 MiMo，模型 mimo-v2.5-asr
preset = "mimo"
# 更换模型：加一行 model = "..." 覆盖预设。

# 想改用 OpenRouter：把上面的 preset 改成 "openrouter"。
# OpenRouter 默认模型：microsoft/mai-transcribe-2
# 要更换模型时，取消下一行注释并修改。
# model = "microsoft/mai-transcribe-2"

[translation]
# 目标语言
target = "简体中文"
# 翻译后润色：默认关闭；需要时改成 true
polish = false

# 其余参数使用默认值；需要时见完整参数参考。
